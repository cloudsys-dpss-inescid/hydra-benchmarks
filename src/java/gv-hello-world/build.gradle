plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "7.1.0"
}

// Property for GraalOS compilation.
ext {
    graalhost = project.hasProperty("graalhost")
}

group 'com.hello_world'
version '1.0'

repositories {
    mavenCentral()
}

shadowJar() {
    configurations = [project.configurations.compileClasspath]
    from sourceSets.main.output
}

dependencies {
    implementation(files(System.getenv('ARGO_HOME') + '/benchmarks/src/java/gh-proxy/build/libs/graalos-proxy-1.0-all.jar'))
}

jar {
    manifest {
        attributes(
                // Does not really matter since we anyway specify main class in 'native-image' command.
                'Main-Class': graalhost ? 'com.hello_world.GraalHostMain' : 'com.hello_world.HelloWorld',
                'Class-Path': configurations.runtimeClasspath.files.collect { it.getName() }.join(' ')
        )
    }
}

if (graalhost) {
    java {
        sourceCompatibility = JavaVersion.toVersion("17")
        targetCompatibility = JavaVersion.toVersion("17")
    }

    // More native image parameters are set via host_setup_env.sh or build-env-rc.sh scripts.
}
